services:
  uis:
    build: ./uis
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/uis
      - backoffice_node_modules:/uis/backoffice/node_modules
    env_file:
      - .env
    networks:
      - monorepo-dev

  services:
    build: ./services
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - ./scripts:/app/scripts
    env_file:
      - .env
    networks:
      - monorepo-dev

networks:
  monorepo-dev:
    name: monorepo-dev

volumes:
  backoffice_node_modules:
