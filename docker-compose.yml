services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]

  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      FLOWER_UNAUTHENTICATED_API: "true"
    depends_on:
      - redis
